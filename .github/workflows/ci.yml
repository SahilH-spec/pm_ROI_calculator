name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: JS engine matches the Python reference
        run: node app/parity.test.js
      - name: Reference model invariant checks
        run: python reference/run.py
      - name: Committed index.html is up to date with app/src
        run: |
          node app/build.js
          git diff --exit-code index.html
