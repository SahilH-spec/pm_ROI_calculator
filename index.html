<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="A discovery-call ROI calculator for property managers. Models cash, capacity and owner value separately, with break-even first.">
<style>html{color-scheme:light}body{margin:0}</style>
</head>
<body>
<title>Property ROI Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* ------------------------------------------------------------------
   Design tokens.
   Two colors only: white, and one blue (hue ~211) used in tints and one deep shade for text.
   Two typefaces only: Newsreader (headings, large figures) and Figtree (everything else).
   Change a token here and it changes everywhere; no component uses a literal color.
------------------------------------------------------------------- */
:root {
  --white: #ffffff;
  --blue-wash: #f4f8fd;      /* page tint, table stripes */
  --blue-light: #dfecf9;     /* the light blue: selected states, panels */
  --blue-line: #c5daf0;      /* borders and rules */
  --blue-mid: #7aa5d1;       /* chart marks only, never text */
  --blue-ink-soft: #476685;  /* secondary text (5.8:1 on white) */
  --blue-ink: #14304d;       /* primary text and primary buttons (13:1 on white) */

  --font-display: "Newsreader", "Iowan Old Style", Georgia, serif;
  --font-ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;

  --radius: 6px;
  --shadow: 0 2px 8px rgba(20, 48, 77, .14);
  --gutter: clamp(16px, 4vw, 40px);
  color-scheme: light;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  background: var(--white);
  color: var(--blue-ink);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.5;
  padding-inline: var(--gutter);
  padding-block: 0;
  font-variant-numeric: tabular-nums;
}

h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 500; text-wrap: balance; letter-spacing: -0.005em; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }

:focus-visible { outline: 2px solid var(--blue-ink); outline-offset: 2px; border-radius: 3px; }

.app { max-width: 1240px; margin-inline: auto; min-height: 100vh; display: flex; flex-direction: column; }

/* ---------- header ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 20px; border-bottom: 1px solid var(--blue-line); flex-wrap: wrap; }
.brand { font-size: 24px; }
.top-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chip { background: var(--blue-light); border-radius: 999px; padding: 3px 12px; font-size: 13px; color: var(--blue-ink); }

/* ---------- buttons ---------- */
.btn { border: 1px solid var(--blue-ink); background: var(--blue-ink); color: var(--white); border-radius: var(--radius); padding: 9px 18px; font-weight: 500; min-height: 40px; }
.btn:hover { background: var(--blue-ink-soft); border-color: var(--blue-ink-soft); }
.btn.quiet { background: var(--white); color: var(--blue-ink); border-color: var(--blue-line); }
.btn.quiet:hover { background: var(--blue-wash); border-color: var(--blue-mid); }
.btn[disabled] { opacity: .45; cursor: default; }
.btn.small { padding: 5px 12px; min-height: 32px; font-size: 14px; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); gap: clamp(24px, 4vw, 56px); padding-block: 32px 24px; flex: 1; }

.steps ol { list-style: none; margin: 0; padding: 0; position: sticky; top: 24px; display: flex; flex-direction: column; gap: 2px; }
.steps button { width: 100%; text-align: left; display: grid; grid-template-columns: 28px 1fr; align-items: center; gap: 10px; padding: 10px 12px; border: 0; border-radius: var(--radius); background: transparent; color: var(--blue-ink-soft); }
.steps button:hover { background: var(--blue-wash); }
.steps .num { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--blue-line); display: grid; place-items: center; font-size: 13px; background: var(--white); }
.steps [aria-current="step"] { background: var(--blue-light); color: var(--blue-ink); font-weight: 600; }
.steps [aria-current="step"] .num { background: var(--blue-ink); color: var(--white); border-color: var(--blue-ink); }
.steps .sub { display: block; font-weight: 400; font-size: 12.5px; color: var(--blue-ink-soft); }

.mobile-progress { display: none; }

/* ---------- step content ---------- */
.step-head { max-width: 62ch; margin-bottom: 24px; }
.step-head h2 { font-size: clamp(28px, 4vw, 38px); line-height: 1.15; margin-bottom: 10px; }
.step-head p { color: var(--blue-ink-soft); font-size: 16px; }
.ask { margin-top: 16px; background: var(--blue-wash); border-left: 3px solid var(--blue-mid); padding: 10px 14px; border-radius: 0 var(--radius) var(--radius) 0; font-size: 14.5px; max-width: 62ch; }
.ask b { font-weight: 600; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px 24px; max-width: 880px; }
.field { min-width: 0; }
.label-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.label-row label, .label-row .lbl { font-weight: 500; font-size: 14.5px; }
.input { display: flex; align-items: stretch; border: 1px solid var(--blue-line); border-radius: var(--radius); background: var(--white); overflow: hidden; }
.input:focus-within { border-color: var(--blue-ink); box-shadow: 0 0 0 1px var(--blue-ink); }
.input input { border: 0; outline: 0; background: transparent; padding: 9px 12px; width: 100%; min-width: 0; min-height: 40px; }
.input .adorn { background: var(--blue-wash); color: var(--blue-ink-soft); padding: 0 11px; display: grid; place-items: center; font-size: 14px; }
.input .adorn.l { border-right: 1px solid var(--blue-line); }
.input .adorn.r { border-left: 1px solid var(--blue-line); }
input[type=number] { -moz-appearance: textfield; appearance: textfield; }
input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.hint { font-size: 13px; color: var(--blue-ink-soft); margin-top: 5px; }

/* help button */
.help { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--blue-mid); background: var(--white); color: var(--blue-ink); font-size: 12px; font-weight: 600; line-height: 1; padding: 0; display: inline-grid; place-items: center; flex: none; }
.help:hover, .help[aria-expanded="true"] { background: var(--blue-light); border-color: var(--blue-ink); }
#tip { position: fixed; z-index: 50; max-width: min(320px, calc(100vw - 24px)); background: var(--white); color: var(--blue-ink); border: 1px solid var(--blue-ink); border-radius: var(--radius); padding: 10px 12px; font-size: 13.5px; line-height: 1.45; pointer-events: none; box-shadow: var(--shadow); }
#tip[hidden] { display: none; }
#tip b { font-weight: 600; }

/* radio cards */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; max-width: 880px; }
.card-opt { position: relative; }
.card-opt input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.card-opt .face { display: block; border: 1px solid var(--blue-line); border-radius: var(--radius); padding: 12px 14px; height: 100%; background: var(--white); }
.card-opt .face b { display: block; font-weight: 600; margin-bottom: 2px; }
.card-opt .face span { font-size: 13.5px; color: var(--blue-ink-soft); }
.card-opt input:checked + .face { background: var(--blue-light); border-color: var(--blue-ink); box-shadow: 0 0 0 1px var(--blue-ink); }
.card-opt input:focus-visible + .face { outline: 2px solid var(--blue-ink); outline-offset: 2px; }
.card-opt:hover .face { border-color: var(--blue-mid); }

.section-title { font-size: 20px; margin: 32px 0 12px; }
.section-title:first-child { margin-top: 0; }

/* tables */
.table-wrap { overflow-x: auto; border: 1px solid var(--blue-line); border-radius: var(--radius); max-width: 100%; }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
th, td { padding: 8px 10px; text-align: left; vertical-align: middle; border-bottom: 1px solid var(--blue-light); }
thead th { background: var(--blue-wash); font-weight: 600; font-size: 13.5px; white-space: nowrap; border-bottom: 1px solid var(--blue-line); }
tbody tr:last-child td, tfoot tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; }
tfoot td { background: var(--blue-wash); font-weight: 600; }
td input { border: 1px solid transparent; background: transparent; border-radius: 4px; padding: 7px 8px; width: 100%; min-width: 0; min-height: 36px; }
td input:hover { border-color: var(--blue-line); }
td input:focus { border-color: var(--blue-ink); background: var(--white); outline: 0; }
td input.n { text-align: right; width: 96px; }
.th-flex { display: inline-flex; align-items: center; gap: 6px; }
.row-x { border: 0; background: transparent; width: 32px; height: 32px; border-radius: 50%; color: var(--blue-ink-soft); font-size: 18px; line-height: 1; }
.row-x:hover { background: var(--blue-light); color: var(--blue-ink); }
.sticky-col { position: sticky; left: 0; background: var(--white); z-index: 1; }
thead .sticky-col, tfoot .sticky-col { background: var(--blue-wash); }
.cell-note { font-size: 12.5px; color: var(--blue-ink-soft); }
.table-actions { margin-top: 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

.seg { display: inline-flex; border: 1px solid var(--blue-line); border-radius: var(--radius); overflow: hidden; background: var(--white); }
.seg button { border: 0; background: transparent; padding: 7px 14px; min-height: 36px; border-right: 1px solid var(--blue-line); }
.seg button:last-child { border-right: 0; }
.seg button:hover { background: var(--blue-wash); }
.seg button[aria-pressed="true"] { background: var(--blue-ink); color: var(--white); }

.callout { background: var(--blue-light); border-radius: var(--radius); padding: 12px 16px; max-width: 880px; font-size: 14.5px; }
.callout + .callout { margin-top: 10px; }

.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 36px; max-width: 880px; }

/* ---------- live bar ---------- */
.livebar { position: sticky; bottom: 0; background: var(--white); border-top: 1px solid var(--blue-line); margin-inline: calc(var(--gutter) * -1); padding: 10px var(--gutter) calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 10; }
.livebar-in { max-width: 1240px; margin-inline: auto; display: flex; align-items: center; gap: 12px 28px; flex-wrap: wrap; }
.metric { display: flex; flex-direction: column; min-width: 0; }
.metric .k { font-size: 12.5px; color: var(--blue-ink-soft); display: inline-flex; align-items: center; gap: 5px; }
.metric .v { font-family: var(--font-display); font-size: 24px; line-height: 1.1; }
.livebar .spacer { flex: 1; }

/* ---------- results ---------- */
.results-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
.headline { font-family: var(--font-display); font-size: clamp(24px, 3.2vw, 32px); line-height: 1.22; max-width: 38ch; text-wrap: balance; }
.controls { display: flex; flex-wrap: wrap; gap: 16px 28px; align-items: end; margin-bottom: 28px; padding: 14px 16px; background: var(--blue-wash); border-radius: var(--radius); }
.controls .field { min-width: 0; }
.range { display: flex; align-items: center; gap: 12px; }
.range input[type=range] { accent-color: var(--blue-ink); width: 200px; max-width: 40vw; }
.range output { min-width: 3.4ch; font-weight: 600; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 0; border: 1px solid var(--blue-line); border-radius: var(--radius); margin-bottom: 32px; }
.kpi { padding: 16px 18px; border-right: 1px solid var(--blue-line); border-bottom: 1px solid var(--blue-line); margin: 0 -1px -1px 0; }
.kpi .k { font-size: 13px; color: var(--blue-ink-soft); display: flex; align-items: center; gap: 6px; }
.kpi .v { font-family: var(--font-display); font-size: 34px; line-height: 1.15; margin-top: 4px; }
.kpi .s { font-size: 13px; color: var(--blue-ink-soft); margin-top: 2px; }

.buckets { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px; margin-bottom: 36px; }
.bucket { border-top: 2px solid var(--blue-ink); padding-top: 12px; }
.bucket h3 { font-size: 20px; display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.bucket .big { font-family: var(--font-display); font-size: 28px; margin: 6px 0 2px; }
.bucket p { font-size: 14px; color: var(--blue-ink-soft); }
.bucket.separate { border-top-style: dashed; }

.flows { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px 40px; margin-bottom: 36px; }
.flow-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 8px 0; border-bottom: 1px solid var(--blue-light); }
.flow-row .bar { grid-column: 1 / -1; height: 6px; background: var(--blue-wash); border-radius: 3px; overflow: hidden; }
.flow-row .bar i { display: block; height: 100%; border-radius: 3px; background: var(--blue-mid); }
.flow-row.cost .bar i { background: var(--blue-ink); }
.flow-row .amt { font-weight: 600; }
.flow-total { display: flex; justify-content: space-between; padding: 10px 0; font-weight: 600; }

.chart-box { position: relative; margin-bottom: 8px; }
.chart-box svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart-tip { position: absolute; pointer-events: none; background: var(--white); border: 1px solid var(--blue-ink); border-radius: var(--radius); padding: 8px 10px; font-size: 13px; box-shadow: var(--shadow); white-space: nowrap; z-index: 5; }
.chart-tip[hidden] { display: none; }
.legend { display: flex; gap: 8px 22px; flex-wrap: wrap; font-size: 13.5px; color: var(--blue-ink-soft); margin-bottom: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.legend svg { width: 32px; height: 8px; }

details { margin-top: 12px; }
summary { cursor: pointer; font-weight: 500; padding: 6px 0; }
details .table-wrap { margin-top: 8px; }

.flags { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; max-width: 880px; }
.flags li { background: var(--blue-wash); border-left: 3px solid var(--blue-ink); border-radius: 0 var(--radius) var(--radius) 0; padding: 10px 14px; font-size: 14.5px; }
.flags li.ok { border-left-color: var(--blue-mid); }

.export { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.note { font-size: 13px; color: var(--blue-ink-soft); }
.empty { border: 1px dashed var(--blue-mid); border-radius: var(--radius); padding: 28px; max-width: 640px; }
.empty h3 { font-size: 22px; margin-bottom: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- phone / narrow ---------- */
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); padding-block: 20px; gap: 20px; }
  .steps ol { position: static; flex-direction: row; overflow-x: auto; gap: 4px; padding-bottom: 4px; }
  .steps button { grid-template-columns: 28px; justify-content: center; padding: 6px; }
  .steps .label { display: none; }
  .mobile-progress { display: block; font-weight: 600; margin-bottom: 4px; }
  .brand { font-size: 21px; }
  .metric .v { font-size: 20px; }
  .livebar-in { gap: 8px 18px; }
  .livebar .seg button { padding: 6px 9px; font-size: 13px; }
  .kpi .v { font-size: 30px; }
}
@media (max-width: 480px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
  .livebar .metric.opt { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }

/* chart marks (all from tokens) */
.c-grid { stroke: var(--blue-light); stroke-width: 1; }
.c-zero { stroke: var(--blue-mid); stroke-width: 1.5; }
.c-axis { fill: var(--blue-ink-soft); font-size: 12px; font-family: var(--font-ui); }
.c-axis.sel { fill: var(--blue-ink); font-weight: 600; }
.c-sel { stroke: var(--blue-ink); stroke-width: 2.5; fill: none; }
.c-oth { stroke: var(--blue-mid); stroke-width: 1.75; fill: none; }
.c-lbl { fill: var(--blue-ink-soft); font-size: 12.5px; font-family: var(--font-ui); }
.c-lbl.sel { fill: var(--blue-ink); font-weight: 600; }
.c-dot { fill: var(--white); stroke: var(--blue-ink); stroke-width: 2; }
.c-cross { stroke: var(--blue-ink-soft); stroke-width: 1; stroke-dasharray: 3 3; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 88px; background: var(--blue-ink); color: var(--white); padding: 10px 16px; border-radius: var(--radius); z-index: 60; max-width: calc(100vw - 32px); font-size: 14px; }
.toast[hidden] { display: none; }
.no-dl [data-action=pdf], .no-dl [data-action=csv], .no-dl [data-help=exportPdf], .no-dl [data-help=exportCsv] { display: none; }

table.wide { min-width: 520px; }
.table-wrap th:first-child, .table-wrap td:first-child { min-width: 140px; }

</style>
<div class="app">
  <header class="top">
    <h1 class="brand">Property ROI Calculator</h1>
    <div class="top-actions">
      <span class="chip" id="example-chip">Example data loaded</span>
      <button type="button" class="btn quiet small" data-action="example">Load example</button>
      <button type="button" class="btn quiet small" data-action="clear">Clear all</button>
    </div>
  </header>
  <div class="shell">
    <nav class="steps" id="steps" aria-label="Steps"></nav>
    <main>
      <p class="mobile-progress" id="mobile-progress"></p>
      <div id="main-step"></div>
    </main>
  </div>
  <div class="livebar" id="livebar">
    <div class="livebar-in">
      <div class="seg" role="group" aria-label="Scenario">
        <button type="button" data-action="scen" data-k="conservative" aria-pressed="true">Conservative</button>
        <button type="button" data-action="scen" data-k="expected" aria-pressed="false">Expected</button>
        <button type="button" data-action="scen" data-k="optimistic" aria-pressed="false">Optimistic</button>
      </div>
      <div class="metric"><span class="k">Cash ROI, 3 years <button type="button" class="help" data-help="cashRoi" aria-label="About cash ROI" aria-expanded="false">?</button></span><span class="v" id="lb-roi"></span></div>
      <div class="metric opt"><span class="k">Net cash, 3 years</span><span class="v" id="lb-net"></span></div>
      <div class="metric"><span class="k">Break-even <button type="button" class="help" data-help="breakeven" aria-label="About break-even" aria-expanded="false">?</button></span><span class="v" id="lb-be"></span></div>
      <div class="metric opt"><span class="k">Payback <button type="button" class="help" data-help="payback" aria-label="About payback" aria-expanded="false">?</button></span><span class="v" id="lb-pay"></span></div>
    </div>
  </div>
</div>
<div id="tip" role="tooltip" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script>
/* ROI engine: JavaScript port of reference/engine.py.
   Pure functions, no DOM. Constants and judgment calls are documented in docs/METHODOLOGY.md. */
(function (root) {
  "use strict";

  var C = {
    PROD_HOURS: 1880,
    WEEKS_WORKED: 47,
    BURDEN: 0.30,
    WAGE_GROWTH: 0.034,
    DISCOUNT: 0.10,
    HORIZON: 36,
    SUB_ESCALATOR: 0.03
  };

  var WORKFLOWS = ["rent", "acct", "owner", "leasing", "maint", "comms", "renewals", "inspect", "reentry"];

  var RED_EXPECTED_M0 = {
    rent: 0.30, acct: 0.25, owner: 0.35, leasing: 0.15, maint: 0.15,
    comms: 0.10, renewals: 0.20, inspect: 0.15, reentry: 0.40
  };

  var MATURITY = { M0: 1.0, M1: 0.85, M2: 0.55, M3: 0.30 };

  var SCEN = {
    conservative: { red_mult: 0.6, cap: 0.15, redeploy: 0.0, days_saved: 0.0, hire_credit: 0.5 },
    expected:     { red_mult: 1.0, cap: 0.25, redeploy: 0.5, days_saved: 0.0, hire_credit: 1.0 },
    optimistic:   { red_mult: 1.5, cap: 0.35, redeploy: 0.75, days_saved: 2.0, hire_credit: 1.0 }
  };

  var RAMP = [[3, 0.25], [6, 0.60], [9, 0.85], [Infinity, 1.0]];

  function ramp(m) {
    for (var i = 0; i < RAMP.length; i++) if (m <= RAMP[i][0]) return RAMP[i][1];
  }

  function num(x) { x = Number(x); return isFinite(x) ? x : 0; }

  function roleRate(r) { return num(r.salary) * (1 + C.BURDEN) / C.PROD_HOURS; }

  function run(p, scen, opts) {
    opts = opts || {};
    var realizationScale = opts.realization == null ? 1 : opts.realization;
    var benefitScale = opts.benefitScale == null ? 1 : opts.benefitScale;
    var s = SCEN[scen];
    var roles = p.roles.filter(function (r) { return num(r.fte) > 0; });
    var tools = p.tools || [];

    // ---- hours freed (steady state, annual) ----
    var raw = {}, rawTotal = 0;
    roles.forEach(function (r) {
      var tot = 0;
      WORKFLOWS.forEach(function (w) {
        var h = num(r.hours && r.hours[w]);
        var red = Math.min(0.85, RED_EXPECTED_M0[w] * s.red_mult) * MATURITY[p.maturity];
        tot += h * C.WEEKS_WORKED * red;
      });
      raw[r.name] = tot; rawTotal += tot;
    });
    var fteTotal = roles.reduce(function (a, r) { return a + num(r.fte); }, 0);
    if (!fteTotal) fteTotal = 1e-9;
    var capHours = s.cap * fteTotal * C.PROD_HOURS;
    var scale = rawTotal ? Math.min(1, capHours / rawTotal) : 0;
    var freedTotal = rawTotal * scale;
    var g = freedTotal / (fteTotal * C.PROD_HOURS);
    var capValue = roles.reduce(function (a, r) { return a + raw[r.name] * scale * roleRate(r); }, 0);
    var blendedCostFte = roles.reduce(function (a, r) { return a + num(r.salary) * (1 + C.BURDEN) * num(r.fte); }, 0) / fteTotal;
    var blendedRate = roles.reduce(function (a, r) { return a + roleRate(r) * num(r.fte); }, 0) / fteTotal;

      breakeven_total: (pvCash + pvNc) ? pvCost / (pvCash + pvNc) : Infinity,

/* ---------- chart ---------- */
var CH = { W: 760, H: 320, l: 64, r: 112, t: 16, b: 40 };
function kfmt(x) { var a = Math.abs(x), t; if (a >= 1e6) t = (a / 1e6).toFixed(a % 1e6 ? 1 : 0).replace(/\.0$/, "") + "M"; else if (a >= 1000) t = (a / 1000).toFixed(a % 1000 ? 1 : 0).replace(/\.0$/, "") + "k"; else t = String(Math.round(a)); return (x < 0 ? MINUS : "") + "$" + t; }
function niceScale(min, max) {
  var span = (max - min) || 1, raw = span / 5, mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / mag;
  var step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * mag;
  return { lo: Math.floor(min / step) * step, hi: Math.ceil(max / step) * step, step: step };
}
function chartGeom(c) {
  var all = [0]; SCEN_KEYS.forEach(function (k) { all = all.concat(c.res[k].cumulative); });
  var sc = niceScale(Math.min.apply(null, all), Math.max.apply(null, all));
  var iw = CH.W - CH.l - CH.r, ih = CH.H - CH.t - CH.b;
  return { sc: sc, x: function (m) { return CH.l + m / 36 * iw; }, y: function (v) { return CH.t + (sc.hi - v) / (sc.hi - sc.lo) * ih; }, iw: iw, ih: ih };
}
var DASH = { conservative: "", expected: "7 5", optimistic: "2 4" };
function chartHTML(c) {
  var avail = ($("#res-body") || {}).clientWidth || 760;
  CH.W = Math.max(320, Math.min(760, avail)); CH.H = CH.W < 500 ? 280 : 320; CH.l = CH.W < 500 ? 52 : 64; CH.r = CH.W < 500 ? 92 : 112;
  var g = chartGeom(c), sc = g.sc, svg = "", i;
  for (var v = sc.lo; v <= sc.hi + sc.step / 2; v += sc.step) {
    svg += '<line class="c-grid" x1="' + CH.l + '" x2="' + (CH.W - CH.r) + '" y1="' + g.y(v) + '" y2="' + g.y(v) + '"/><text class="c-axis" x="' + (CH.l - 10) + '" y="' + (g.y(v) + 4) + '" text-anchor="end">' + kfmt(v) + "</text>";
  }
  svg += '<line class="c-zero" x1="' + CH.l + '" x2="' + (CH.W - CH.r) + '" y1="' + g.y(0) + '" y2="' + g.y(0) + '"/>';
  for (i = 0; i <= 36; i += 6) svg += '<text class="c-axis" x="' + g.x(i) + '" y="' + (CH.H - CH.b + 22) + '" text-anchor="middle">' + i + "</text>";
  svg += '<text class="c-axis" x="' + (CH.l + g.iw / 2) + '" y="' + (CH.H - 4) + '" text-anchor="middle">Months after go-live</text>';
  var order = SCEN_KEYS.filter(function (k) { return k !== state.scenario; }).concat([state.scenario]), labels = [];
  order.forEach(function (k) {
    var cum = [0].concat(c.res[k].cumulative), d = cum.map(function (v, m) { return (m ? "L" : "M") + g.x(m).toFixed(1) + " " + g.y(v).toFixed(1); }).join(" ");
    svg += '<path d="' + d + '" fill="none" class="' + (k === state.scenario ? "c-sel" : "c-oth") + '"' + (DASH[k] ? ' stroke-dasharray="' + DASH[k] + '"' : "") + "/>";
    labels.push({ k: k, y: g.y(cum[36]) });
  });
  labels.sort(function (a, b) { return a.y - b.y; });
  for (i = 1; i < labels.length; i++) if (labels[i].y - labels[i - 1].y < 16) labels[i].y = labels[i - 1].y + 16;
  labels.forEach(function (l) { svg += '<text class="c-lbl' + (l.k === state.scenario ? " sel" : "") + '" x="' + (CH.W - CH.r + 8) + '" y="' + (l.y + 4) + '">' + SCEN_LABEL[l.k] + "</text>"; });
  var pb = c.sel.payback_month_cash;
  if (pb) svg += '<circle class="c-dot" cx="' + g.x(pb) + '" cy="' + g.y(c.sel.cumulative[pb - 1]) + '" r="5"/><text class="c-axis sel" x="' + g.x(pb) + '" y="' + (g.y(c.sel.cumulative[pb - 1]) - 12) + '" text-anchor="middle">Payback, month ' + pb + "</text>";
  svg += '<line id="c-cross" class="c-cross" y1="' + CH.t + '" y2="' + (CH.H - CH.b) + '" x1="0" x2="0" style="display:none"/>' +
    '<rect id="c-hit" x="' + CH.l + '" y="' + CH.t + '" width="' + g.iw + '" height="' + g.ih + '" fill="transparent"/>';
  var legend = '<div class="legend">' + SCEN_KEYS.map(function (k) {
    return '<span><svg viewBox="0 0 32 8" aria-hidden="true"><line x1="0" x2="32" y1="4" y2="4" class="' + (k === state.scenario ? "c-sel" : "c-oth") + '"' + (DASH[k] ? ' stroke-dasharray="' + DASH[k] + '"' : "") + "/></svg>" + SCEN_LABEL[k] + "</span>";
  }).join("") + "</div>";
  var months = [6, 12, 18, 24, 30, 36];
  var table = '<details id="d-chart"' + (state.open["d-chart"] ? " open" : "") + '><summary>Show as a table</summary><div class="table-wrap"><table><thead><tr><th>Month</th>' + SCEN_KEYS.map(function (k) { return '<th class="num">' + SCEN_LABEL[k] + "</th>"; }).join("") + "</tr></thead><tbody>" +
    months.map(function (m) { return "<tr><td>" + m + "</td>" + SCEN_KEYS.map(function (k) { return '<td class="num">' + money(c.res[k].cumulative[m - 1]) + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody></table></div></details>";
  return legend + '<div class="chart-box" id="chart-box"><svg viewBox="0 0 ' + CH.W + " " + CH.H + '" role="img" aria-label="Cumulative net cash by month for three scenarios. ' +
    SCEN_LABEL[state.scenario] + " ends at " + money(c.sel.cumulative[35]) + ' at month 36.">' + svg + '</svg><div class="chart-tip" id="chart-tip" hidden></div></div>' + table;
}
function wireChart(c) {
  var hit = $("#c-hit"), box = $("#chart-box"), tipEl = $("#chart-tip"), cross = $("#c-cross");
  if (!hit) return;
  var g = chartGeom(c), svg = box.querySelector("svg");
  function move(e) {
    var rect = svg.getBoundingClientRect(), k = rect.width / CH.W, px = (e.clientX - rect.left) / k;
    var m = Math.max(1, Math.min(36, Math.round((px - CH.l) / g.iw * 36)));
    cross.setAttribute("x1", g.x(m)); cross.setAttribute("x2", g.x(m)); cross.style.display = "";
    tipEl.innerHTML = "<b>Month " + m + "</b>" + SCEN_KEYS.map(function (s) { return "<div>" + SCEN_LABEL[s] + ": " + money(c.res[s].cumulative[m - 1]) + "</div>"; }).join("");
    tipEl.hidden = false;
    var left = g.x(m) * k + 14;
    if (left + tipEl.offsetWidth > rect.width) left = g.x(m) * k - tipEl.offsetWidth - 14;
    tipEl.style.left = Math.max(0, left) + "px"; tipEl.style.top = "8px";
  }
  hit.addEventListener("pointermove", move);
  hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", function () { cross.style.display = "none"; tipEl.hidden = true; });
}

  var wfRows = WF.map(function (w) { return [w[1]].concat(p.roles.map(function (rr) { return rr.hours[w[0]] ? int(num(rr.hours[w[0]])) : "-"; })); }), rw = (CW * 0.4) / Math.max(1, p.roles.length);
  table([CW * 0.48].concat(p.roles.map(function () { return CW * 0.52 / Math.max(1, p.roles.length); })), ["Hours per week by workflow"].concat(p.roles.map(function (rr) { var n = rr.name || "Role"; return n.length > 9 ? n.split(" ")[0].slice(0, 9) : n; })), wfRows, { align: ["l"].concat(p.roles.map(function () { return "r"; })), size: 8.5 });
  if (p.tools.length) table([CW * 0.4, CW * 0.2, CW * 0.2, CW * 0.2], ["Tool", "Monthly cost", "Replaced", "Months left"], p.tools.map(function (t) { return [t.name, money(num(t.monthly)), num(t.replacePct) + "%", String(num(t.monthsLeft))]; }), { align: ["l", "r", "r", "r"] });
  table([CW * 0.6, CW * 0.4], ["Platform quote", "Value"], [["Price per unit per month", money2(num(p.perUnit))], ["Monthly minimum", money(num(p.minimum))], ["Setup, months of fees", one(num(p.implMonths))], ["Migration hours", int(num(p.migrationHours))], ["Net change in usage fees per year", money(num(p.usageDelta))], ["Hires otherwise planned", one(num(p.plannedHires))]], { align: ["l", "r"] });

  // ---- checks and assumptions ----
  var fl = flagsFor(c); if (fl.length) { h2("Check before you present"); fl.forEach(function (f) { txt("- " + f, { size: 9.5 }); }); }
  table([CW * 0.28, CW * 0.44, CW * 0.28], ["Item", "Value", "Source"], [
    ["Loaded hourly cost", "Salary x 1.30 / 1,880 hours", "BLS compensation data"], ["Hours worked per year", "47 weeks", "Judgment"], ["Wage growth", "3.4% a year", "BLS Employment Cost Index"],
    ["Discount rate", "10% a year", "Judgment"], ["Subscription escalator", "3% a year", "Judgment"], ["Adoption ramp", "25%, 60%, 85%, then 100% of savings, by quarter", "Judgment"],
    ["Time saved by workflow", "Re-entry 40%, owner reports 35%, rent 30%, accounting 25%, renewals 20%, leasing, maintenance, inspections 15%, communications 10%, before the scenario multiplier (0.6, 1.0, 1.5)", "Judgment; no independent study found"],
    ["Current-setup factors", "100%, 85%, 55%, 30% of savings kept", "Judgment"], ["Hire credit", "50% conservative, 100% expected and optimistic", "Judgment"], ["Vacant days saved per turn", "0, 0, 2 by scenario", "Judgment; no causal evidence for more"],
    ["Default role salaries", "BLS median wages, May 2024", "BLS Occupational Outlook Handbook"], ["Reference platform rates", "$1.49, $3.20, $5.00 per unit; quote-only now", "Third-party reported, 2024"]
  ], { size: 8.5, title: "Assumptions and sources" });
  footer();
  saveFile(fileName("pdf"), doc.output("arraybuffer"), "application/pdf");
}

tipEl = $("#tip");
document.addEventListener("input", onInput);
document.addEventListener("change", function (e) { if (e.target.type === "radio") onInput(e); });
document.addEventListener("click", onClick);
document.addEventListener("pointerover", function (e) { var b = helpBtn(e); if (b && e.pointerType !== "touch" && !pinned) showTip(b); });
document.addEventListener("pointerout", function (e) { var b = helpBtn(e); if (b && e.pointerType !== "touch" && !pinned) hideTip(); });
document.addEventListener("focusin", function (e) { var b = helpBtn(e); if (b) showTip(b); });
document.addEventListener("focusout", function (e) { if (helpBtn(e)) hideTip(); });
document.addEventListener("keydown", function (e) { if (e.key === "Escape") hideTip(); });
window.addEventListener("scroll", function () { if (tipFor) hideTip(); }, { passive: true });
document.addEventListener("toggle", function (e) { if (e.target.id) state.open[e.target.id] = e.target.open; }, true);
initDownloads();
render(false);

var rzT, lastW = window.innerWidth;
window.addEventListener("resize", function () {
  clearTimeout(rzT);
  rzT = setTimeout(function () { if (state.step === STEPS.length - 1 && Math.abs(window.innerWidth - lastW) > 40) { lastW = window.innerWidth; renderResults(); } }, 150);
});

})();
